server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /api 反代后端(同源,免 CORS);保留 /api 前缀(后端服务 /api/v1)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 6m;   # 5MB 照片 + 余量
  }

  # AI 找板:样板缩略图同源反代到视觉服务(/vision-images/x → vision:8000/images/x)
  # 用 resolver + 变量,避免 vision 未起时 nginx 启动失败(未起则缩略图 502,前端 onerror 隐藏)
  location /vision-images/ {
    resolver 127.0.0.11 valid=30s;
    set $vision_host vision;
    rewrite ^/vision-images/(.*)$ /images/$1 break;
    proxy_pass http://$vision_host:8000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
